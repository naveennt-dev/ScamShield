# Checks for every push and pull request. Public-repository safety:
#  - read-only token, no secrets, no pull_request_target (fork code never gets privileged access);
#  - third-party actions pinned to full commit SHAs (tag in the comment);
#  - artefacts are unsigned test builds, kept 7 days — never a release.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scamshield
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: scamshield_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U scamshield" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://scamshield:ci-only-not-a-secret@127.0.0.1:5432/scamshield_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx eslint src scripts tests extension
      - run: npx vitest run
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Device engine gives the same results as the server engine
        run: |
          npm --prefix mobile ci
          node mobile/build-engine.mjs
          ML_BACKEND=embedded LOG_LEVEL=error npx tsx mobile/test/parity.ts

  macos-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Swift tests and both app configurations
        working-directory: macos/ScamShield
        run: ../scripts/test.sh

  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run sync
      - name: Build debug APK (unsigned for distribution; debug key only)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: No network permission in the APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          ! "$AAPT" dump permissions mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "INTERNET|ACCESS_NETWORK_STATE"
      - run: sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scamshield-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
