name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't paste real people's messages, phone numbers or personal data. Security problems → Security tab → Report a vulnerability."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS app, Android app, Browser extension, Web app / API, Other]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: "0.1.0 / abc1234" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce and what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs (optional), description: Remove anything personal first., render: text }
