name: Detection problem (missed scam or false alarm)
description: ScamShield missed a scam or warned about a genuine message/link
labels: [detection]
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted text: replace names, numbers, account details and links' personal parts. Never include OTPs or passwords."
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [Missed scam (shown as safe), False alarm (genuine shown as risky), Wrong explanation]
    validations: { required: true }
  - type: textarea
    id: sample
    attributes: { label: Redacted message or link, render: text }
    validations: { required: true }
  - type: input
    id: result
    attributes: { label: What ScamShield showed, placeholder: "e.g. Safe, score 12" }
