apply plugin: 'com.android.application'

// Release signing. The key NEVER lives in the repository: provide it through environment variables
// (CI secrets) or mobile/android/keystore.properties (git-ignored, on the release machine only):
//   storeFile=/absolute/path/to/scamshield-release.jks
//   storePassword=…   keyAlias=…   keyPassword=…
// Without a complete configuration, release builds stop with an error instead of producing an
// unsigned or debug-signed "release". Debug builds are unaffected.
def releaseSigning = [:]
def keystoreProps = rootProject.file('keystore.properties')
if (keystoreProps.exists()) {
    def p = new Properties()
    keystoreProps.withInputStream { p.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { releaseSigning[it] = p.getProperty(it) }
}
[storeFile: 'SCAMSHIELD_ANDROID_KEYSTORE', storePassword: 'SCAMSHIELD_ANDROID_KEYSTORE_PASSWORD',
 keyAlias: 'SCAMSHIELD_ANDROID_KEY_ALIAS', keyPassword: 'SCAMSHIELD_ANDROID_KEY_PASSWORD'].each { key, env ->
    if (System.getenv(env)) releaseSigning[key] = System.getenv(env)
}
def releaseSigningReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseSigning[it] }

android {
    namespace = "dev.scamshield.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.scamshield.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig releaseSigningReady ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// A release build without the release key is an error, never a silently unsigned artefact.
gradle.taskGraph.whenReady { graph ->
    if (!releaseSigningReady && graph.allTasks.any { it.name ==~ /(assemble|bundle|package)Release/ }) {
        throw new GradleException("Release signing is not configured. Set SCAMSHIELD_ANDROID_KEYSTORE, " +
            "SCAMSHIELD_ANDROID_KEYSTORE_PASSWORD, SCAMSHIELD_ANDROID_KEY_ALIAS and SCAMSHIELD_ANDROID_KEY_PASSWORD, " +
            "or create mobile/android/keystore.properties (see docs/release/RELEASE-CHECKLIST.md).")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
