# Example Prometheus alerting rules for ScamShield (scrape /api/v1/metrics with the METRICS_TOKEN bearer).
# Thresholds are starting points; tune them to observed traffic.
groups:
  - name: scamshield
    rules:
      - alert: ScamShieldHighErrorRate
        expr: sum(rate(scamshield_errors_total{code="INTERNAL_ERROR"}[5m])) / sum(rate(scamshield_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of requests are failing with INTERNAL_ERROR" }
      - alert: ScamShieldLLMDegraded
        expr: sum(rate(scamshield_llm_fallback_total{reason="deterministic"}[15m])) / clamp_min(sum(rate(scamshield_analyses_total[15m])), 1e-9) > 0.5
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Over half of analyses ran without the LLM (OpenRouter failures or rate limits). Check SCAM_*_MODEL availability." }
      - alert: ScamShieldSlowAnalyses
        expr: histogram_quantile(0.95, sum by (le) (rate(scamshield_http_request_duration_ms_bucket{route=~"v1.analyze.*"}[10m]))) > 20000
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "p95 analysis latency above 20s" }
      - alert: ScamShieldOCRFailures
        expr: sum(rate(scamshield_ocr_failures_total[15m])) > 0.1
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "OCR failing repeatedly" }
      - alert: ScamShieldRateLimitSpike
        expr: sum(rate(scamshield_rate_limited_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations: { summary: "Sustained rate limiting — possible abuse or limits too tight" }
